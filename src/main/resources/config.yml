# 储物袋插件配置文件
# 存储方式配置
storage:
  type: "sqlite"  # 可选: yaml, sqlite
  sqlite:
    file: "bags.db"  # SQLite数据库文件路径
  yaml:
    folder: "bags"   # YAML文件存储文件夹

# 储物袋类型配置
bag-types:
  27:
    name: "&a小型储物袋"
    material: PAPER
    custom-model-data: 10021 #储物袋材质
    lore:
      - "&7容量: 27格"
      - "&8ID: %id%"
  54:
    name: "&6中型储物袋"
    material: PAPER
    custom-model-data: 10021 #储物袋材质
    lore:
      - "&7容量: 54格"
      - "&8ID: %id%"
  81:
    name: "&9大型储物袋"
    material: PAPER
    custom-model-data: 10021 #储物袋材质
    lore:
      - "&7容量: 81格 (2页)"
      - "&8ID: %id%"
  108:
    name: "&d巨型储物袋"
    material: PAPER
    custom-model-data: 10021 #储物袋材质
    lore:
      - "&7容量: 108格 (3页)"
      - "&8ID: %id%"

pill-types:
  9:
    name: "&a小型丹瓶"
    material: GLASS_BOTTLE
    custom-model-data: 10031
    lore:
      - "&7容量: 9格"
      - "&8ID: %id%"
  18:
    name: "&6中型丹瓶"
    material: GLASS_BOTTLE
    custom-model-data: 10032
    lore:
      - "&7容量: 18格"
      - "&8ID: %id%"
  27:
    name: "&9大型丹瓶"
    material: GLASS_BOTTLE
    custom-model-data: 10033
    lore:
      - "&7容量: 27格"
      - "&8ID: %id%"

progress-bar:
  length: 20  # 进度条总长度
  filled-color: "&a"  # 已用部分颜色
  empty-color: "&8"   # 未用部分颜色
  show-percentage: true  # 是否显示百分比数字

# 灵石类型配置 (支持自定义)
spirit-stones:
  "§f下品灵石":
    material: PAPER
    custom-model-data: 10016
  "§a中品灵石":
    material: PAPER
    custom-model-data: 10017
  "§6上品灵石":
    material: PAPER
    custom-model-data: 10018
  "§c极品灵石":
    material: PAPER
    custom-model-data: 10019

# 自动拾取设置
auto-pickup:
  enabled: true
  # 需要将储物袋放在背包顶部第一格才生效
  require-slot-zero: true
  check-interval: 5 # 检查间隔(ticks)

# 界面设置
ui:
  page-next: "&a下一页 →"
  page-prev: "&c← 上一页"
  close-button: "&c关闭"
  current-page: "&7第 %page% 页 / %total% 页"
